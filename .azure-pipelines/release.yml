name: $(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: 'esrp'
    type: boolean
    default: false # TODO: change default to true after testing
    displayName: 'Enable ESRP code signing'
  - name: 'github'
    type: boolean
    default: false # TODO: change default to true after testing
    displayName: 'Enable GitHub release publishing'

#
# 1ES Pipeline Templates do not allow using a matrix strategy so we create
# a YAML object parameter with and foreach to create jobs for each entry.
# Each OS has its own matrix object since their build steps differ.
#
  - name: windows_matrix
    type: object
    default:
      - id: windows_x64
        jobName: 'Windows (x64)'
        pool: GitClientPME-1ESHostedPool-intel-pc
        poolArch: amd64
        image: win-x86_64-ado1es
        os: windows
        toolchain: x86_64
        mingwprefix: mingw64

      - id: windows_arm64
        jobName: 'Windows (ARM64)'
        pool: GitClientPME-1ESHostedPool-arm64-pc
        poolArch: arm64
        image: win-arm64-ado1es
        os: windows
        toolchain: clang-aarch64
        mingwprefix: clangarm64

  - name: macos_matrix
    type: object
    default:
      - id: macos_universal
        jobName: 'macOS (x64 + ARM64)'
        pool: 'Azure Pipelines'
        image: macOS-latest
        os: macos

  - name: linux_matrix
    type: object
    default:
      - id: linux_x64
        jobName: 'Linux (x64)'
        pool: GitClientPME-1ESHostedPool-intel-pc
        poolArch: amd64
        image: ubuntu-x86_64-ado1es
        os: linux
        cc_arch: x86_64
        deb_arch: amd64

      - id: linux_arm64
        jobName: 'Linux (ARM64)'
        pool: GitClientPME-1ESHostedPool-arm64-pc
        poolArch: arm64
        image: ubuntu-arm64-ado1es
        os: linux
        cc_arch: aarch64
        deb_arch: arm64

variables:
  - name: 'esrpAppConnectionName'
    value: '1ESGitClient-ESRP-App'
  - name: 'githubConnectionName'
    value: 'GitHub-MicrosoftGit'
  # ESRP signing variables set in the pipeline settings:
  # - esrpEndpointUrl
  # - esrpMI
  # - esrpClientId
  # - esrpTenantId
  # - esrpKeyVaultName
  # - esrpSignReqCertName

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelines
  parameters:
    sdl:
      # SDL source analysis tasks only run on Windows images
      sourceAnalysisPool:
        name: GitClientPME-1ESHostedPool-intel-pc
        image: win-x86_64-ado1es
        os: windows
    stages:
      - stage: prereqs
        displayName: 'Prerequisites'
        jobs:
          - job: prebuild
            displayName: 'Pre-build validation'
            pool:
              name: GitClientPME-1ESHostedPool-intel-pc
              image: ubuntu-x86_64-ado1es
              os: linux
            steps:
              - checkout: self
                fetchDepth: 0
                fetchTags: true
              - task: Bash@3
                displayName: 'Resolve version and tag information'
                name: info
                inputs:
                  targetType: inline
                  script: |
                    set -euo pipefail
                    tag_name="v9.99.99.vfs.0.0"
                    tag_sha="$(git rev-parse HEAD)"
                    git_version="9.99.99.vfs.0.0"
                    echo "Git version: $git_version"
                    echo "Tag name: $tag_name"
                    echo "Tag SHA: $tag_sha"
                    echo "##vso[task.setvariable variable=git_version;isOutput=true;isReadOnly=true]$git_version"
                    echo "##vso[task.setvariable variable=tag_name;isOutput=true;isReadOnly=true]$tag_name"
                    echo "##vso[task.setvariable variable=tag_sha;isOutput=true;isReadOnly=true]$tag_sha"
                    echo "##vso[build.updatebuildnumber]${tag_name} ($(Build.BuildNumber))"

      - stage: build
        displayName: 'Build'
        dependsOn: [prereqs]
        jobs:
          #
          # Windows build jobs
          #
          - ${{ each dim in parameters.windows_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
                hostArchitecture: ${{ dim.poolArch }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
                toolchain: ${{ dim.toolchain }}
                mingwprefix: ${{ dim.mingwprefix }}
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                # Add Git Bash to the PATH so Bash tasks can find it
                - task: BatchScript@1
                  displayName: 'Add Git Bash to PATH'
                  inputs:
                    filename: ./.azure-pipelines/scripts/windows/setup-git-bash.cmd
                # Install Azure CLI on arm64 (not pre-installed on these agents)
                - ${{ if eq(dim.poolArch, 'arm64') }}:
                  - powershell: |
                      $ProgressPreference = 'SilentlyContinue'
                      $msi = "$env:TEMP\AzureCLI.msi"
                      Write-Host "Downloading Azure CLI (x64)..."
                      Invoke-WebRequest -Uri https://aka.ms/installazurecliwindows -OutFile $msi
                      Write-Host "Installing Azure CLI..."
                      Start-Process msiexec.exe -ArgumentList "/i", $msi, "/quiet", "/norestart" -Wait
                      $azPath = "C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin"
                      Write-Host "##vso[task.prependpath]$azPath"
                      Write-Host "Azure CLI installed."
                    displayName: 'Install Azure CLI (arm64)'
                # Setup ESRP code signing for Windows (sets ESRP_TOOL, ESRP_AUTH)
                - ${{ if eq(parameters.esrp, true) }}:
                  - template: .azure-pipelines/esrp/windows/setup.yml@self
                    parameters:
                      serviceConnectionName: $(esrpAppConnectionName)
                      esrpClientId: $(esrpClientId)
                      keyVaultName: $(esrpKeyVaultName)
                      signCertName: $(esrpSignReqCertName)
                # TODO: add tasks to set up Git for Windows SDK
                # TODO: add tasks to build Git and installers
                - script: |
                    echo $(mingwprefix)
                    echo $(toolchain)
                    mkdir $(Build.ArtifactStagingDirectory)\app
                    copy C:\Windows\System32\calc.exe $(Build.ArtifactStagingDirectory)\app\example1.exe
                    copy C:\Windows\System32\calc.exe $(Build.ArtifactStagingDirectory)\app\example2.exe
                    copy C:\Windows\System32\calc.exe $(Build.ArtifactStagingDirectory)\app\example3.exe
                  displayName: 'Dummy build'
                #
                # To sign Windows binaries with ESRP, call esrpsign.sh
                # with the files to sign as arguments. Requires the
                # following environment variables to be set:
                #   ESRP_TOOL           - set by the setup template above
                #   ESRP_AUTH           - set by the setup template above
                #   SYSTEM_ACCESSTOKEN  - $(System.AccessToken)
                #
                - ${{ if eq(parameters.esrp, true) }}:
                  - bash: |
                      .azure-pipelines/esrp/windows/esrpsign.sh \
                        "$BUILD_ARTIFACTSTAGINGDIRECTORY/app/example1.exe" \
                        "$BUILD_ARTIFACTSTAGINGDIRECTORY/app/example2.exe" \
                        "$BUILD_ARTIFACTSTAGINGDIRECTORY/app/example3.exe"
                    displayName: 'Example ESRP signing'
                    env:
                      ESRP_TOOL: $(ESRP_TOOL)
                      ESRP_AUTH: $(ESRP_AUTH)
                      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir $(Build.ArtifactStagingDirectory)\_final
                    xcopy /s /y $(Build.ArtifactStagingDirectory)\app $(Build.ArtifactStagingDirectory)\_final
                  displayName: 'Dummy collect artifacts'

          #
          # macOS build jobs
          #
          - ${{ each dim in parameters.macos_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                - task: Bash@3
                  displayName: 'Install build dependencies'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail

                      # The agent's native arm64 Homebrew lives at
                      # /opt/homebrew. Install a separate x86_64 Homebrew
                      # under /usr/local so we can fetch the x86_64 build
                      # of gettext/libintl alongside the arm64 one.
                      arch -x86_64 /bin/bash -c \
                        "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                      arch -x86_64 /usr/local/bin/brew install gettext

                      # Native (arm64) build dependencies.
                      brew install automake asciidoc xmlto docbook
                      brew link --force gettext

                      # Make a universal libintl.a out of the two
                      # arch-specific copies, dropped at the workspace
                      # root so the build's LDFLAGS = -L"$(pwd)" can find
                      # it. libintl depends on iconv, but we deliberately
                      # use the system's universal /usr/lib/libiconv.dylib
                      # rather than Homebrew's libiconv (which exports
                      # _libiconv* symbols, while Homebrew's gettext was
                      # built against system iconv with _iconv* symbols).
                      lipo -create \
                        -output libintl.a \
                        /usr/local/opt/gettext/lib/libintl.a \
                        /opt/homebrew/opt/gettext/lib/libintl.a
                # TODO: add tasks to build Git and installers
                - script: |
                    echo "Hello, Mac!"
                    mkdir -p $(Build.ArtifactStagingDirectory)/app
                    cp /bin/echo $(Build.ArtifactStagingDirectory)/app/example
                  displayName: 'Dummy build'
                - ${{ if eq(parameters.esrp, true) }}:
                  - template: .azure-pipelines/esrp/sign.yml@self
                    parameters:
                      displayName: 'Example sign binaries'
                      folderPath: '$(Build.ArtifactStagingDirectory)/app'
                      pattern: '**/*'
                      useArchive: true # Must be true when macOS signing
                      inlineOperation: |
                        [
                          {
                            "KeyCode": "CP-401337-Apple",
                            "OperationCode": "MacAppDeveloperSign",
                            "ToolName": "sign",
                            "ToolVersion": "1.0",
                            "Parameters": {
                              "Hardening": "Enable"
                            }
                          }
                        ]
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir -p $(Build.ArtifactStagingDirectory)/_final
                    cp -R $(Build.ArtifactStagingDirectory)/app/* $(Build.ArtifactStagingDirectory)/_final/
                  displayName: 'Dummy collect artifacts'

          #
          # Linux build jobs
          #
          - ${{ each dim in parameters.linux_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
                hostArchitecture: ${{ dim.poolArch }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
                cc_arch: ${{ dim.cc_arch }}
                deb_arch: ${{ dim.deb_arch }}
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                - task: Bash@3
                  displayName: 'Log build environment'
                  inputs:
                    targetType: inline
                    script: |
                      lsb_release -a || true
                      uname -a
                      id
                - task: Bash@3
                  displayName: 'Install build dependencies'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      sudo apt-get update -q
                      sudo apt-get install -y -q --no-install-recommends \
                        build-essential \
                        tcl tk gettext asciidoc xmlto \
                        libcurl4-gnutls-dev libpcre2-dev zlib1g-dev libexpat-dev \
                        curl ca-certificates
                - task: Bash@3
                  displayName: 'Build microsoft-git Debian package'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail

                      VERSION="$(git_version)"
                      # Git's GIT-VERSION-GEN expects .rc rather than -rc
                      BUILD_VERSION="$(echo "$VERSION" | sed 's/-rc/.rc/g')"
                      echo "$BUILD_VERSION" >version
                      make GIT-VERSION-FILE

                      PKGNAME="microsoft-git_${VERSION}_$(deb_arch)"
                      PKGDIR="$(Build.ArtifactStagingDirectory)/pkgroot"
                      rm -rf "$PKGDIR"
                      mkdir -p "$PKGDIR/DEBIAN"

                      DESTDIR="$PKGDIR" make -j"$(nproc)" V=1 DEVELOPER=1 \
                        USE_LIBPCRE=1 \
                        USE_CURL_FOR_IMAP_SEND=1 NO_OPENSSL=1 \
                        NO_CROSS_DIRECTORY_HARDLINKS=1 \
                        ASCIIDOC8=1 ASCIIDOC_NO_ROFF=1 \
                        ASCIIDOC='TZ=UTC asciidoc' \
                        prefix=/usr/local \
                        gitexecdir=/usr/local/lib/git-core \
                        libexecdir=/usr/local/lib/git-core \
                        htmldir=/usr/local/share/doc/git/html \
                        install install-doc install-html

                      # Based on https://packages.ubuntu.com/xenial/vcs/git
                      cat >"$PKGDIR/DEBIAN/control" <<CTRL
                      Package: microsoft-git
                      Version: $VERSION
                      Section: vcs
                      Priority: optional
                      Architecture: $(deb_arch)
                      Depends: libcurl3-gnutls, liberror-perl, libexpat1, libpcre2-8-0, perl, perl-modules, zlib1g
                      Maintainer: GitClient <gitclient@microsoft.com>
                      Description: Git client built from the https://github.com/microsoft/git repository,
                        specialized in supporting monorepo scenarios. Includes the Scalar CLI.
                      CTRL

                      mkdir -p "$(Build.ArtifactStagingDirectory)/app"
                      dpkg-deb -Zxz --build "$PKGDIR" \
                        "$(Build.ArtifactStagingDirectory)/app/$PKGNAME.deb"
                - ${{ if eq(parameters.esrp, true) }}:
                  # ESRP ADO tasks require .NET, so we install it here since the
                  # Linux images do not have it by default.
                  - task: UseDotNet@2
                    displayName: 'Install .NET for ESRP'
                    inputs:
                      packageType: sdk
                      version: '8.x'
                  - template: .azure-pipelines/esrp/sign.yml@self
                    parameters:
                      displayName: 'Example sign Debian package'
                      folderPath: '$(Build.ArtifactStagingDirectory)/app'
                      pattern: '**/*.deb'
                      inlineOperation: |
                        [
                          {
                            "KeyCode": "CP-453387-Pgp",
                            "OperationCode": "LinuxSign",
                            "ToolName": "sign",
                            "ToolVersion": "1.0",
                            "Parameters": {}
                          }
                        ]
                - task: Bash@3
                  displayName: 'Stage Debian package for upload'
                  inputs:
                    targetType: inline
                    script: |
                      set -euo pipefail
                      mkdir -p "$(Build.ArtifactStagingDirectory)/_final"
                      mv "$(Build.ArtifactStagingDirectory)/app/microsoft-git_$(git_version)_$(deb_arch).deb" \
                        "$(Build.ArtifactStagingDirectory)/_final/"

      - stage: release
        displayName: 'Release'
        dependsOn: [prereqs, build]
        jobs:
          #
          # Windows validation jobs
          #
          - ${{ each dim in parameters.windows_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
                hostArchitecture: ${{ dim.poolArch }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    dir $(Pipeline.Workspace)\assets\${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # macOS validation jobs
          #
          - ${{ each dim in parameters.macos_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    ls $(Pipeline.Workspace)/assets/${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # Linux validation jobs
          #
          - ${{ each dim in parameters.linux_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
                hostArchitecture: ${{ dim.poolArch }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    ls $(Pipeline.Workspace)/assets/${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # GitHub release publishing
          #
          - job: github
            dependsOn:
              - ${{ each dim in parameters.windows_matrix }}:
                - validate_${{ dim.id }}
              - ${{ each dim in parameters.macos_matrix }}:
                - validate_${{ dim.id }}
              - ${{ each dim in parameters.linux_matrix }}:
                - validate_${{ dim.id }}
            displayName: 'Publish GitHub release'
            condition: and(succeeded(), eq('${{ parameters.github }}', true))
            pool:
              name: GitClientPME-1ESHostedPool-intel-pc
              image: ubuntu-x86_64-ado1es
              os: linux
            variables:
              tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
              tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
              git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - ${{ each dim in parameters.windows_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
                - ${{ each dim in parameters.macos_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
                - ${{ each dim in parameters.linux_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
            steps:
              - task: GitHubRelease@1
                displayName: 'Create Draft GitHub Release'
                inputs:
                  gitHubConnection: $(githubConnectionName)
                  repositoryName: microsoft/git
                  tag: '$(tag_name)'
                  tagSource: userSpecifiedTag
                  target: '$(tag_sha)'
                  title: '$(tag_name)'
                  isDraft: true
                  addChangeLog: true
                  assets: |
                    $(Pipeline.Workspace)/assets/windows_x64/*.exe
                    $(Pipeline.Workspace)/assets/windows_x64/*.zip
                    $(Pipeline.Workspace)/assets/windows_arm64/*.exe
                    $(Pipeline.Workspace)/assets/windows_arm64/*.zip
                    $(Pipeline.Workspace)/assets/macos_universal/*.pkg
                    $(Pipeline.Workspace)/assets/macos_universal/*.dmg
                    $(Pipeline.Workspace)/assets/macos_universal/*.tar.gz
                    $(Pipeline.Workspace)/assets/linux_x64/*.deb
                    $(Pipeline.Workspace)/assets/linux_x64/*.tar.gz
                    $(Pipeline.Workspace)/assets/linux_arm64/*.deb
                    $(Pipeline.Workspace)/assets/linux_arm64/*.tar.gz
