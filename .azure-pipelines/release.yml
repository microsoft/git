name: $(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: 'esrp'
    type: boolean
    default: true
    displayName: 'Enable ESRP code signing'
  - name: linux_matrix
    type: object
    default:
      - id: linux_x64
        jobName: 'Linux (x64)'
        pool: GitClientPME-1ESHostedPool-intel-pc
        poolArch: amd64
        image: ubuntu-x86_64-ado1es
        os: linux
        cc_arch: x86_64
        deb_arch: amd64

      - id: linux_arm64
        jobName: 'Linux (ARM64)'
        pool: GitClientPME-1ESHostedPool-arm64-pc
        poolArch: arm64
        image: ubuntu-arm64-ado1es
        os: linux
        cc_arch: aarch64
        deb_arch: arm64

variables:
  - name: 'esrpAppConnectionName'
    value: '1ESGitClient-ESRP-App'
  - name: 'esrpMIConnectionName'
    value: '1ESGitClient-ESRP-MI'
  - name: 'esrpMIConnectionId'
    value: '4d9dfb25-048b-42c8-a3cf-8d795d0c8a75'
  - name: 'githubConnectionName'
    value: 'GitHub-MicrosoftGit'
  # ESRP signing variables set in the pipeline settings:
  # - esrpEndpointUrl
  # - esrpMI
  # - esrpClientId
  # - esrpTenantId
  # - esrpKeyVaultName
  # - esrpSignReqCertName

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: GitClientPME-1ESHostedPool-intel-pc
        image: win-x86_64-ado1es
        os: windows
    stages:
      - stage: build
        displayName: 'Build'
        jobs:
          #
          # Linux build jobs
          #
          - ${{ each dim in parameters.linux_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
                hostArchitecture: ${{ dim.poolArch }}
              variables:
                cc_arch: ${{ dim.cc_arch }}
                deb_arch: ${{ dim.deb_arch }}
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self

                - script: |
                    # Determine tmate arch from cc_arch
                    case "$(cc_arch)" in
                    x86_64) tmate_arch=amd64;;
                    aarch64) tmate_arch=arm64v8;;
                    *) echo "Unknown arch: $(cc_arch)" >&2; exit 1;;
                    esac &&

                    # Install tmate static binary
                    curl -Lo /tmp/tmate.tar.xz \
                      "https://github.com/tmate-io/tmate/releases/download/2.4.0/tmate-2.4.0-static-linux-${tmate_arch}.tar.xz" &&
                    mkdir -p "$HOME/bin" &&
                    tar x -C "$HOME/bin" -f /tmp/tmate.tar.xz --strip-components=1 &&
                    export PATH="$HOME/bin:$PATH" &&

                    # Fetch SSH public keys from GitHub profiles
                    mkdir -p ~/.ssh &&
                    curl -sf https://api.github.com/users/dscho/keys >/tmp/github-keys.json &&
                    curl -sf https://api.github.com/users/mjcheetham/keys >>/tmp/github-keys.json &&
                    sed -n 's/.*"key": "\(.*\)".*/\1/p' /tmp/github-keys.json >~/.ssh/authorized_keys &&
                    test -s ~/.ssh/authorized_keys || {
                      echo "ERROR: no SSH keys found for dscho or mjcheetham" >&2
                      exit 1
                    } &&

                    # Generate an SSH key (needed for tmate)
                    echo -e 'y\n' | ssh-keygen -q -t rsa -N '' -f ~/.ssh/id_rsa &&

                    # Start tmate session in detached mode
                    tmate -S /tmp/tmate.sock -a ~/.ssh/authorized_keys new-session -d &&
                    tmate -S /tmp/tmate.sock wait tmate-ready &&

                    # Print SSH invocation
                    tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
                  displayName: 'Start tmate for debugging (detached)'

                # TODO: add tasks to set up build environment
                # TODO: add tasks to build Git and installers
                - script: |
                    echo $(cc_arch)
                    echo $(deb_arch)
                    mkdir -p $(Build.ArtifactStagingDirectory)/app
                    debroot=$(Build.ArtifactStagingDirectory)/pkgroot
                    mkdir -p $debroot/DEBIAN
                    cat > $debroot/DEBIAN/control <<CTRL
                    Package: example
                    Version: 1.0
                    Architecture: $(deb_arch)
                    Maintainer: test
                    Description: dummy
                    CTRL
                    dpkg-deb --build $debroot $(Build.ArtifactStagingDirectory)/app/example_$(deb_arch).deb
                  displayName: 'Dummy build'
                - ${{ if eq(parameters.esrp, true) }}:
                  # ESRP ADO tasks require .NET, so we install it here since the
                  # Linux images do not have it by default.
                  - task: UseDotNet@2
                    displayName: 'Install .NET for ESRP'
                    inputs:
                      packageType: sdk
                      version: '8.x'
                  - template: .azure-pipelines/esrp/sign.yml@self
                    parameters:
                      displayName: 'Example sign Debian package'
                      folderPath: '$(Build.ArtifactStagingDirectory)/app'
                      pattern: '**/*.deb'
                      inlineOperation: |
                        [
                          {
                            "KeyCode": "CP-453387-Pgp",
                            "OperationCode": "LinuxSign",
                            "ToolName": "sign",
                            "ToolVersion": "1.0",
                            "Parameters": {}
                          }
                        ]
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir -p $(Build.ArtifactStagingDirectory)/_final
                    cp -R $(Build.ArtifactStagingDirectory)/app/* $(Build.ArtifactStagingDirectory)/_final/
                  displayName: 'Dummy collect artifacts'
                - script: |
                    PATH="$HOME/bin:$PATH"
                    while test -e /tmp/tmate.sock
                    do
                      tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
                      sleep 5
                    done
                  displayName: 'Wait for tmate session to end'
                  condition: always()

