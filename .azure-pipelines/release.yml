name: $(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelines
  parameters:
    sdl:
      sourceAnalysisPool:
        name: GitClientPME-1ESHostedPool-intel-pc
        image: win-x86_64-ado1es
        os: windows
    stages:
      - stage: stage1
        displayName: 'Stage1'
        jobs:
          - job: job1
            displayName: 'Job1'
            pool:
              name: GitClientPME-1ESHostedPool-arm64-pc
              image: win-arm64-ado1es-vnext
              os: windows
              hostArchitecture: arm64
            steps:
              - checkout: self
