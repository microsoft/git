name: $(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

resources:
  repositories:
    - repository: 1ESPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

parameters:
  - name: 'esrp'
    type: boolean
    default: false # TODO: change default to true after testing
    displayName: 'Enable ESRP code signing'
  - name: 'github'
    type: boolean
    default: false # TODO: change default to true after testing
    displayName: 'Enable GitHub release publishing'

#
# 1ES Pipeline Templates do not allow using a matrix strategy so we create
# a YAML object parameter with and foreach to create jobs for each entry.
# Each OS has its own matrix object since their build steps differ.
#
  - name: windows_matrix
    type: object
    default:
      - id: windows_x64
        jobName: 'Windows (x64)'
        pool: GitClientPME-1ESHostedPool-intel-pc
        image: win-x86_64-ado1es
        os: windows
        toolchain: x86_64
        mingwprefix: mingw64

      - id: windows_arm64
        jobName: 'Windows (ARM64)'
        pool: GitClientPME-1ESHostedPool-arm64-pc
        image: win-arm64-ado1es
        os: windows
        toolchain: clang-aarch64
        mingwprefix: clangarm64

  - name: macos_matrix
    type: object
    default:
      - id: macos_universal
        jobName: 'macOS (x64 + ARM64)'
        pool: 'Azure Pipelines'
        image: macOS-latest
        os: macos

  - name: linux_matrix
    type: object
    default:
      - id: linux_x64
        jobName: 'Linux (x64)'
        pool: GitClientPME-1ESHostedPool-intel-pc
        image: ubuntu-x86_64-ado1es
        os: linux
        cc_arch: x86_64
        deb_arch: amd64

      - id: linux_arm64
        jobName: 'Linux (ARM64)'
        pool: GitClientPME-1ESHostedPool-arm64-pc
        image: ubuntu-arm64-ado1es
        os: linux
        cc_arch: aarch64
        deb_arch: arm64

variables:
  - name: 'esrpAppConnectionName'
    value: '1ESGitClient-ESRP-App'
  - name: 'esrpMIConnectionName'
    value: '1ESGitClient-ESRP-MI'
  - name: 'githubConnectionName'
    value: 'GitHub-MicrosoftGit'
  # ESRP signing variables set in the pipeline settings:
  # - esrpEndpointUrl
  # - esrpClientId
  # - esrpTenantId
  # - esrpKeyVaultName
  # - esrpAuthCertName
  # - esrpSignReqCertName

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelines
  parameters:
    sdl:
      # SDL source analysis tasks only run on Windows images
      sourceAnalysisPool:
        name: GitClientPME-1ESHostedPool-intel-pc
        image: win-x86_64-ado1es
        os: windows
    stages:
      - stage: prereqs
        displayName: 'Prerequisites'
        jobs:
          - job: prebuild
            displayName: 'Pre-build validation'
            pool:
              name: GitClientPME-1ESHostedPool-intel-pc
              image: ubuntu-x86_64-ado1es
              os: linux
            steps:
              - task: Bash@3
                displayName: 'Resolve version and tag information'
                name: info
                inputs:
                  targetType: inline
                  script: |
                    # TODO: determine git_version, tag_name, and tag_sha
                    # TODO: error if the current commit is not an annotated tag
                    git_version=TODO_GITVER
                    tag_name=TODO_TAGNAME
                    tag_sha=TODO_TAGSHA
                    echo "Git version: $git_version"
                    echo "Tag name: $tag_name"
                    echo "Tag SHA: $tag_sha"
                    echo "##vso[task.setvariable variable=git_version;isOutput=true;isReadOnly=true]$git_version"
                    echo "##vso[task.setvariable variable=tag_name;isOutput=true;isReadOnly=true]$tag_name"
                    echo "##vso[task.setvariable variable=tag_sha;isOutput=true;isReadOnly=true]$tag_sha"
                    echo "##vso[build.updatebuildnumber]${tag_name} ($(Build.BuildNumber))"

      - stage: build
        displayName: 'Build'
        dependsOn: [prereqs]
        jobs:
          #
          # Windows build jobs
          #
          - ${{ each dim in parameters.windows_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
                toolchain: ${{ dim.toolchain }}
                mingwprefix: ${{ dim.mingwprefix }}
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                - ${{ if eq(parameters.esrp, true) }}:
                  - task: NuGetAuthenticate@1
                    displayName: 'Authenticate NuGet (ESRP)'
                  - task: NuGetCommand@2
                    displayName: 'Download ESRP client'
                    inputs:
                      command: custom
                      arguments: >-
                        install Microsoft.EsrpClient
                        -source https://pkgs.dev.azure.com/mseng/1ES/_packaging/GitClient/nuget/v3/index.json
                        -OutputDirectory $(Agent.TempDirectory)/esrp
                  - powershell: |
                      $esrpTool = Get-ChildItem -Path "$(Agent.TempDirectory)\esrp" -Filter "ESRPClient.exe" -Recurse | Select-Object -First 1
                      if (-not $esrpTool) {
                        Write-Error "ESRPClient.exe not found"
                        exit 1
                      }
                      Write-Host "Found ESRP client: $($esrpTool.FullName)"
                      Write-Host "##vso[task.setvariable variable=ESRP_TOOL]$($esrpTool.FullName)"
                    displayName: 'Locate ESRP client'
                  - task: AzureKeyVault@2
                    displayName: 'Download ESRP certificates'
                    inputs:
                      azureSubscription: $(esrpMIConnectionName)
                      KeyVaultName: $(esrpKeyVaultName)
                      SecretsFilter: '$(esrpAuthCertName),$(esrpSignReqCertName)'
                  - powershell: |
                      $certs = @("$(esrpAuthCertName)", "$(esrpSignReqCertName)")
                      foreach ($cert in $certs) {
                        $path = "$(Agent.TempDirectory)\$cert.pfx"
                        Write-Host "Importing certificate: $cert"
                        $pfx = Import-PfxCertificate -FilePath $path -CertStoreLocation "Cert:\LocalMachine\My"
                        Write-Host "  Thumbprint: $($pfx.Thumbprint)"
                      }
                    displayName: 'Install ESRP certificates'
                # TODO: add tasks to set up Git for Windows SDK
                # TODO: add tasks to build Git and installers
                - script: |
                    echo $(mingwprefix)
                    echo $(toolchain)
                  displayName: 'Dummy build'
                - ${{ if eq(parameters.esrp, true) }}:
                  - bash: |
                      cp /c/Windows/System32/calc.exe example1.exe
                      cp /c/Windows/System32/calc.exe example2.exe
                      cp /c/Windows/System32/calc.exe example3.exe
                      .azure-pipelines/esrp/windows/esrpsign.sh \
                        example1.exe \
                        example2.exe \
                        example3.exe
                    displayName: 'Example ESRP signing'
                    env:
                      ESRP_TOOL: $(ESRP_TOOL)
                      ESRP_CLIENT_ID: $(esrpClientId)
                      ESRP_TENANT_ID: $(esrpTenantId)
                      ESRP_AUTH_CERT_NAME: $(esrpAuthCertName)
                      ESRP_SIGN_CERT_NAME: $(esrpSignCertName)
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir $(Build.ArtifactStagingDirectory)\_final
                    echo TODO > $(Build.ArtifactStagingDirectory)\_final\placeholder.txt
                  displayName: 'Dummy prepare artifacts'

          #
          # macOS build jobs
          #
          - ${{ each dim in parameters.macos_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                # TODO: add tasks to set up build environment
                # TODO: add tasks to build Git and installers
                - script: |
                    echo "Hello, Mac!"
                  displayName: 'Dummy build'
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir -p $(Build.ArtifactStagingDirectory)/_final
                    echo "TODO" > $(Build.ArtifactStagingDirectory)/_final/placeholder.txt
                  displayName: 'Dummy prepare artifacts'

          #
          # Linux build jobs
          #
          - ${{ each dim in parameters.linux_matrix }}:
            - job: ${{ dim.id }}
              displayName: ${{ dim.jobName }}
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              variables:
                tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
                tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
                git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
                cc_arch: ${{ dim.cc_arch }}
                deb_arch: ${{ dim.deb_arch }}
              templateContext:
                outputs:
                  - output: pipelineArtifact
                    targetPath: '$(Build.ArtifactStagingDirectory)/_final'
                    artifactName: '${{ dim.id }}'
              steps:
                - checkout: self
                # TODO: add tasks to set up build environment
                # TODO: add tasks to build Git and installers
                - script: |
                    echo $(cc_arch)
                    echo $(deb_arch)
                  displayName: 'Dummy build'
                # TODO: put final artifacts under $(Build.ArtifactStagingDirectory)/_final
                - script: |
                    mkdir -p $(Build.ArtifactStagingDirectory)/_final
                    echo "TODO" > $(Build.ArtifactStagingDirectory)/_final/placeholder.txt
                  displayName: 'Dummy prepare artifacts'

      - stage: release
        displayName: 'Release'
        dependsOn: [prereqs, build]
        jobs:
          #
          # Windows validation jobs
          #
          - ${{ each dim in parameters.windows_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    dir $(Pipeline.Workspace)\assets\${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # macOS validation jobs
          #
          - ${{ each dim in parameters.macos_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    ls $(Pipeline.Workspace)/assets/${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # Linux validation jobs
          #
          - ${{ each dim in parameters.linux_matrix }}:
            - job: validate_${{ dim.id }}
              displayName: 'Validate ${{ dim.jobName }}'
              pool:
                name: ${{ dim.pool }}
                image: ${{ dim.image }}
                os: ${{ dim.os }}
              templateContext:
                inputs:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
              steps:
                # TODO: add artifact validation steps
                - script: |
                    ls $(Pipeline.Workspace)/assets/${{ dim.id }}
                  displayName: 'Validate artifacts'

          #
          # GitHub release publishing
          #
          - job: github
            dependsOn:
              - ${{ each dim in parameters.windows_matrix }}:
                - validate_${{ dim.id }}
              - ${{ each dim in parameters.macos_matrix }}:
                - validate_${{ dim.id }}
              - ${{ each dim in parameters.linux_matrix }}:
                - validate_${{ dim.id }}
            displayName: 'Publish GitHub release'
            condition: and(succeeded(), eq('${{ parameters.github }}', true))
            pool:
              name: GitClientPME-1ESHostedPool-intel-pc
              image: ubuntu-x86_64-ado1es
              os: linux
            variables:
              tag_name: $[stageDependencies.prereqs.prebuild.outputs['info.tag_name']]
              tag_sha: $[stageDependencies.prereqs.prebuild.outputs['info.tag_sha']]
              git_version: $[stageDependencies.prereqs.prebuild.outputs['info.git_version']]
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - ${{ each dim in parameters.windows_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
                - ${{ each dim in parameters.macos_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
                - ${{ each dim in parameters.linux_matrix }}:
                  - input: pipelineArtifact
                    artifactName: '${{ dim.id }}'
                    targetPath: $(Pipeline.Workspace)/assets/${{ dim.id }}
            steps:
              - task: GitHubRelease@1
                displayName: 'Create Draft GitHub Release'
                inputs:
                  gitHubConnection: $(githubConnectionName)
                  repositoryName: microsoft/git
                  tag: '$(tag_name)'
                  tagSource: userSpecifiedTag
                  target: '$(tag_sha)'
                  title: '$(tag_name)'
                  isDraft: true
                  addChangeLog: true
                  assets: |
                    $(Pipeline.Workspace)/assets/windows_x64/*.exe
                    $(Pipeline.Workspace)/assets/windows_x64/*.zip
                    $(Pipeline.Workspace)/assets/windows_arm64/*.exe
                    $(Pipeline.Workspace)/assets/windows_arm64/*.zip
                    $(Pipeline.Workspace)/assets/macos_universal/*.pkg
                    $(Pipeline.Workspace)/assets/macos_universal/*.dmg
                    $(Pipeline.Workspace)/assets/macos_universal/*.tar.gz
                    $(Pipeline.Workspace)/assets/linux_x64/*.deb
                    $(Pipeline.Workspace)/assets/linux_x64/*.tar.gz
                    $(Pipeline.Workspace)/assets/linux_arm64/*.deb
                    $(Pipeline.Workspace)/assets/linux_arm64/*.tar.gz
