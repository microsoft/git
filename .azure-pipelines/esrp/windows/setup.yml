parameters:
  - name: nugetFeed
    type: string
    default: https://pkgs.dev.azure.com/mseng/1ES/_packaging/GitClient/nuget/v3/index.json
  - name: managedIdentity
    type: string
  - name: esrpClientId
    type: string
  - name: tenantId
    type: string
  - name: serviceConnectionName
    type: string
  - name: keyVaultName
    type: string
  - name: signCertName
    type: string

steps:
  - task: NuGetAuthenticate@1
    displayName: 'Authenticate NuGet (ESRP)'
  - task: NuGetCommand@2
    displayName: 'Download ESRP client'
    inputs:
      command: custom
      arguments: >-
        install Microsoft.EsrpClient
        -source ${{ parameters.nugetFeed }}
        -OutputDirectory $(Agent.TempDirectory)/esrp
  - powershell: |
      $esrpTool = Get-ChildItem -Path "$(Agent.TempDirectory)\esrp" -Filter "ESRPClient.exe" -Recurse | Select-Object -First 1
      if (-not $esrpTool) { Write-Error "ESRPClient.exe not found"; exit 1 }
      Write-Host "Found ESRP client: $($esrpTool.FullName)"
      Write-Host "##vso[task.setvariable variable=ESRP_TOOL]$($esrpTool.FullName)"
    displayName: 'Locate ESRP client'
  - powershell: |
      $name = "${{ parameters.serviceConnectionName }}"
      $encodedName = [Uri]::EscapeDataString($name)
      $url = "$(System.CollectionUri)$(System.TeamProject)/_apis/serviceendpoint/endpoints?endpointNames=$encodedName&api-version=7.1"
      Write-Host "Resolving service connection: $name"
      Write-Host "URL: $url"
      try {
        $response = Invoke-RestMethod -Uri $url -Headers @{
          Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        }
      } catch {
        Write-Host "HTTP request failed: $_"
        Write-Host "Status code: $($_.Exception.Response.StatusCode)"
        throw
      }
      Write-Host "Response count: $($response.count)"
      Write-Host "Response: $($response | ConvertTo-Json -Depth 3)"
      if ($response.count -eq 0) {
        Write-Error "Service connection '$name' not found"
        exit 1
      }
      $id = $response.value[0].id
      Write-Host "Service connection ID: $id"
      Write-Host "##vso[task.setvariable variable=ESRP_SERVICE_CONNECTION_ID]$id"
    displayName: 'Resolve ESRP service connection ID'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  - powershell: |
      $authJson = @{
        Version = "1.0.0"
        AuthenticationType = "AAD_MSI_WIF"
        EsrpClientId = "${{ parameters.esrpClientId }}"
        ClientId = "${{ parameters.managedIdentity }}"
        TenantId = "${{ parameters.tenantId }}"
        AADAuthorityBaseUri = "https://login.microsoftonline.com/"
        FederatedTokenData = @{
          JobId = "$(System.JobId)"
          PlanId = "$(System.PlanId)"
          ProjectId = "$(System.TeamProjectId)"
          Hub = "$(System.HostType)"
          Uri = "$(System.CollectionUri)"
          ServiceConnectionId = "$(ESRP_SERVICE_CONNECTION_ID)"
          SystemAccessToken = "SYSTEM_ACCESSTOKEN"
        }
        RequestSigningCert = @{
          GetCertFromKeyVault = $true
          KeyVaultName = "${{ parameters.keyVaultName }}"
          KeyVaultCertName = "${{ parameters.signCertName }}"
        }
      } | ConvertTo-Json -Depth 4

      $authPath = "$(Agent.TempDirectory)\esrp-auth.json"
      $authJson | Set-Content -Path $authPath -Encoding UTF8
      Write-Host "Generated ESRP auth JSON: $authPath"
      Write-Host "##vso[task.setvariable variable=ESRP_AUTH]$authPath"
    displayName: 'Generate ESRP auth JSON'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
